<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      var legacyBookReviewsPath = '/book-reviews';
      var redirectTarget = '/' + location.search + location.hash;

      if (
        location.pathname === legacyBookReviewsPath ||
        location.pathname === legacyBookReviewsPath + '/'
      ) {
        location.replace(redirectTarget);
      } else {
        location.replace('/');
      }
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
